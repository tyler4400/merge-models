name: 自动部署新版本到服务器

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

# US runner SCP to China CVM hangs after SSH auth. Publish Release tarball; CVM curls HTTPS.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 构建静态站
        run: |
          npm ci
          npm run build

      - name: 打包发布目录
        run: |
          mkdir -p cvm-release
          cp -a dist cvm-release/
          cp nginx.conf cvm-release/
          cp docker-compose.cvm.yml cvm-release/docker-compose.yml
          tar czf cvm-release.tar.gz -C cvm-release .

      - name: 发布到 GitHub Release（供 CVM 拉取）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=cvm-deploy-latest
          git fetch --tags origin || true
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          git push -f origin "refs/tags/$TAG"
          gh release create "$TAG" cvm-release.tar.gz \
            --title "CVM deploy bundle" \
            --notes "Auto-built static bundle for Tencent CVM. Not a product version tag." \
            --latest=false

      - name: 登录服务器拉取并部署
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.RSA_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            mkdir -p ~/demo/cvm-release
            cd ~/demo
            curl -fsSL --retry 3 --retry-delay 2 \
              -o cvm-release.tar.gz \
              "https://github.com/tyler4400/merge-models/releases/download/cvm-deploy-latest/cvm-release.tar.gz"
            tar xzf cvm-release.tar.gz -C cvm-release
            rm -f cvm-release.tar.gz
            cd cvm-release
            docker compose up -d --force-recreate
            docker image prune -f
