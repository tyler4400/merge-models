name: 自动部署新版本到服务器

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build --tag "merge-models:${{ github.sha }}" .

      - name: 打包 compose 与镜像
        run: |
          mkdir -p cvm-release
          docker save "merge-models:${{ github.sha }}" | gzip > cvm-release/merge-models.tar.gz
          cp docker-compose.yml cvm-release/
          echo "IMAGE_TAG=${{ github.sha }}" > cvm-release/.env

      - name: 上传到 CVM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.RSA_PRIVATE_KEY }}
          source: cvm-release
          target: ~/demo/

      - name: 登录服务器并部署
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.RSA_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/demo/cvm-release
            gzip -dc merge-models.tar.gz | docker load
            docker compose up -d
            rm -f merge-models.tar.gz
            docker image prune -f
