name: 自动部署新版本到服务器

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: deploy-cvm
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/tyler4400/merge-models

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tyler4400/merge-models:${{ github.sha }}
            ghcr.io/tyler4400/merge-models:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 服务器拉取并启动
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.RSA_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p /root/merge-models
            cat > /root/merge-models/docker-compose.yml <<EOF
            name: merge-models
            services:
              web:
                image: ghcr.io/tyler4400/merge-models:latest
                container_name: merge-models
                ports:
                  - "18447:80"
                restart: unless-stopped
            EOF
            cd /root/merge-models
            docker compose pull
            docker compose up -d --force-recreate
            docker logout ghcr.io || true
            docker image prune -f
