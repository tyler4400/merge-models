name: 自动部署新版本到服务器

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 构建静态站
        run: |
          npm ci
          npm run build

      - name: 打包发布目录
        run: |
          mkdir -p cvm-release
          cp -a dist cvm-release/
          cp nginx.conf cvm-release/
          cp docker-compose.cvm.yml cvm-release/docker-compose.yml

      - name: 上传到 CVM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.RSA_PRIVATE_KEY }}
          source: cvm-release
          target: ~/demo/
          overwrite: true
          timeout: 30s
          command_timeout: 3m

      - name: 登录服务器并部署
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.RSA_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ~/demo/cvm-release
            docker compose up -d --force-recreate
            docker image prune -f
